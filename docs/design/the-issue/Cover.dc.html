<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offprint — Issue cover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 528px; height: 816px; box-sizing: border-box; padding: 48px 48px 44px; background: #ffffff; color: #111111; font-family: 'Source Serif 4', Georgia, serif; display: flex; flex-direction: column">
  <div style="display: flex; justify-content: space-between; align-items: baseline; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">
    <span>Issue 07</span>
    <span>Friday, 30 October 2026</span>
  </div>
  <div style="height: 3px; background: {{ink}}; margin-top: 12px"></div>
  <h1 style="margin: 18px 0 0; font-size: 92px; line-height: 0.95; font-weight: 700; letter-spacing: -0.03em; color: {{ink}}">Offprint</h1>
  <div style="height: 1px; background: {{ink}}; margin-top: 18px"></div>
  <p style="margin: 10px 0 0; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">Your reading, collected and printed</p>

  <div style="flex-grow: 1"></div>

  <p style="margin: 0; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">For the flight to</p>
  <p style="margin: 4px 0 0; font-size: 76px; line-height: 1; font-style: italic; font-weight: 400; letter-spacing: -0.02em">Lisbon</p>

  <div style="margin-top: 40px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 20px; font-weight: 600; line-height: 1.2">How to Do Great Work</span>
      <span style="font-size: 15px; font-style: italic">Paul Graham</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 20px; font-weight: 600; line-height: 1.2">Reflections on Trusting Trust</span>
      <span style="font-size: 15px; font-style: italic">Ken Thompson</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 20px; font-weight: 600; line-height: 1.2">Choose Boring Technology</span>
      <span style="font-size: 15px; font-style: italic">Dan McKinley</span>
    </div>
    <span style="font-size: 15px">and three more</span>
  </div>

  <div style="height: 1px; background: {{ink}}; margin-top: 36px"></div>
  <div style="display: flex; justify-content: space-between; margin-top: 10px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">
    <span>6 pieces</span>
    <span>About 1 h 25 min</span>
    <span>68 pages</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ink":{"editor":"color","default":"#111111","options":["#111111","#1f3fb8","#7a2e12"]},"$preview":{"width":528,"height":816}}'>
class Component extends DCLogic {
  renderVals() {
    return { ink: this.props.ink ?? '#111111' };
  }
}
</script>
</body>
</html>
