<title>Paperbrew Onboarding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout concept: one quiet card at a time for setup; after setup, a "desk" with the next issue on top, the reading pile below, and setup status in a side rail. Same editorial monochrome as the product: ink on warm paper, hairlines, no accent colour in the chrome. */
:root {
  --bg: #f6f4ef;
  --card: #fffefb;
  --ink: #111111;
  --ink-2: #55524b;
  --line: #d9d5cb;
  --line-2: #ebe8e0;
  --inv: #fffefb;
  --warn-bg: #fbf1d9;
  --warn-ink: #6b4a06;
  --warn-line: #e4cd8e;
  --sheet: #fffdf8;
  --sheet-ink: #151412;
  --display: 'Fraunces', 'Source Serif 4', Georgia, serif;
  --body: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --ui: 'DM Sans', system-ui, sans-serif;
  --gutter: 24px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141311; --card: #1c1b18; --ink: #f1eee7; --ink-2: #aaa69b; --line: #3a3832; --line-2: #2a2924;
    --inv: #141311; --warn-bg: #2d2410; --warn-ink: #e8c777; --warn-line: #5a4616; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141311; --card: #1c1b18; --ink: #f1eee7; --ink-2: #aaa69b; --line: #3a3832; --line-2: #2a2924;
  --inv: #141311; --warn-bg: #2d2410; --warn-ink: #e8c777; --warn-line: #5a4616; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -0.015em; line-height: 1.12; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(30px, 5vw, 40px); }
h2 { font-size: 24px; }
h3 { font-size: 18px; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.eyebrow { font-family: var(--ui); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* Buttons: hairline outline, filled on hover (as the product) */
button, .btn { font: inherit; font-family: var(--ui); font-size: 14px; font-weight: 500; min-height: 44px; padding: 8px 18px; border: 1px solid var(--ink); border-radius: 4px; background: transparent; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: background-color 120ms, color 120ms; }
button:disabled { opacity: 0.45; cursor: default; }
@media (hover: hover) { button:hover:not(:disabled) { background: var(--ink); color: var(--inv); } }
.primary { background: var(--ink); color: var(--inv); }
@media (hover: hover) { .primary:hover:not(:disabled) { background: transparent; color: var(--ink); } }
.ghost { border-color: transparent; padding-inline: 10px; text-decoration: underline; text-underline-offset: 3px; }
.sm { min-height: 40px; padding: 6px 14px; font-size: 13px; }
.block { width: 100%; }

/* Top bar */
.top { max-width: 1120px; margin: 0 auto; padding-block: 20px; display: flex; align-items: center; gap: 24px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 21px; }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav button { border: 0; border-radius: 4px; min-height: 40px; padding: 6px 12px; }
.nav button[aria-current="page"] { background: var(--ink); color: var(--inv); }

/* Onboarding card */
.ob { max-width: 560px; margin: 0 auto; padding-top: 4px; }
.dots { display: flex; gap: 6px; align-items: center; justify-content: center; margin-bottom: 20px; font-family: var(--ui); font-size: 13px; color: var(--ink-2); }
.dots i { width: 28px; height: 3px; background: var(--line); border-radius: 2px; }
.dots i.on { background: var(--ink); }
.dots span { margin-left: 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 32px; display: flex; flex-direction: column; gap: 22px; }
.ob .card { animation: rise 260ms ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.foot { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.foot .grow { flex: 1; }
.beats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
.beats li { display: grid; grid-template-columns: 44px 1fr; gap: 14px; padding-block: 16px; border-top: 1px solid var(--line-2); align-items: start; }
.beats li:first-child { border-top: 0; padding-top: 4px; }
.beats svg { width: 44px; height: 44px; }
.beats h3 { margin-bottom: 2px; }

/* Choice cards, switches, chips */
.choices { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.choice { text-align: left; flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 6px; height: auto; padding: 14px; border-color: var(--line); background: transparent; }
.choice[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
@media (hover: hover) { .choice:hover:not(:disabled) { background: transparent; color: var(--ink); border-color: var(--ink); } }
.choice b { font-family: var(--ui); font-size: 14px; }
.choice span { font-family: var(--ui); font-size: 12.5px; color: var(--ink-2); font-weight: 400; white-space: normal; text-align: left; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-width: 52px; border-color: var(--line); padding: 6px 12px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--inv); border-color: var(--ink); }
.sw { width: 46px; min-height: 28px; height: 28px; padding: 0; border-radius: 14px; position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); transition: transform 160ms; }
.sw::before { content: ""; position: absolute; inset: -8px -4px; }
.hit { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; margin: -9px; cursor: pointer; }
.sw[aria-checked="true"] { background: var(--ink); }
.sw[aria-checked="true"]::after { transform: translateX(18px); background: var(--inv); }
@media (hover: hover) { .sw:hover:not(:disabled) { background: transparent; } .sw[aria-checked="true"]:hover:not(:disabled) { background: var(--ink); } }
.row { display: flex; align-items: center; gap: 12px; }
.row.between { justify-content: space-between; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; gap: 12px; padding-block: 12px; border-top: 1px solid var(--line-2); }
.list li:first-child { border-top: 0; }
.list .grow { flex: 1; min-width: 0; }
.field { font: inherit; font-family: var(--ui); font-size: 15px; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); color: var(--ink); width: 100%; min-width: 0; }
.field:focus-visible { border-color: var(--ink); }
.callout { border: 1px solid var(--ink); border-radius: 6px; padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; }
.callout .big { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: -0.01em; }
.warn { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line); border-radius: 6px; padding: 14px 16px; font-family: var(--ui); font-size: 14px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.addr { display: flex; gap: 8px; align-items: center; }
.addr code { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 4px; }
.tick { width: 22px; height: 22px; flex: none; }
.bar { height: 6px; background: var(--line-2); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ink); width: 0; transition: width 200ms linear; }
input[type=range] { width: 100%; accent-color: var(--ink); min-height: 40px; }

/* Magazine preview. Pages are paper, so they keep paper colours in both themes. */
.mag { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.6fr); gap: 14px; align-items: start; }
.page { background: var(--sheet); color: var(--sheet-ink); border: 1px solid #d9d5cb; box-shadow: 0 6px 18px rgba(0,0,0,.14); aspect-ratio: 5 / 7; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-family: var(--b); overflow: hidden; min-width: 0; }
.cover { justify-content: space-between; }
.cover .bar-a { height: 6px; background: var(--a); }
.cover .meta { font-family: var(--ui); font-size: 7px; letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
.cover .t { font-family: var(--d); font-weight: 700; font-size: 25px; line-height: 1; letter-spacing: -0.02em; }
.cover ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 8.5px; line-height: 1.25; }
.cover li { border-top: 1px solid rgba(0,0,0,.18); padding-top: 4px; }
.spread { display: grid; grid-template-columns: 1fr 1fr; box-shadow: 0 6px 18px rgba(0,0,0,.14); }
.spread .page { box-shadow: none; }
.spread .page:first-child { border-right-color: #bdb8ac; }
.page .kick { font-family: var(--ui); font-size: 6.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--a); font-weight: 700; }
.page h4 { margin: 0; font-family: var(--d); font-size: 12px; line-height: 1.1; font-weight: 700; }
.page .tx { font-size: 6.6px; line-height: 1.4; }
.page .quote { font-family: var(--d); font-size: 10px; line-height: 1.2; border-left: 2px solid var(--a); padding-left: 6px; }
.mini { width: 100%; max-width: 150px; height: auto; }
@media (max-width: 480px) { .page .tx { font-size: 6px; } .cover .t { font-size: 20px; } }

/* Desk */
.shell { max-width: 1120px; margin: 0 auto; }
.desk { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
@media (max-width: 899px) { .desk { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.hero { padding: 32px; gap: 18px; }
.hero .stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--ui); font-size: 14px; color: var(--ink-2); }
.hero .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pile { padding: 8px 24px; gap: 0; }
.pile .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 16px 8px; flex-wrap: wrap; }
.art { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding-block: 14px; border-top: 1px solid var(--line-2); }
.art .ti { font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.25; }
.art .sub { font-family: var(--ui); font-size: 13px; color: var(--ink-2); }
.art input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--ink); margin: 0; }
.tag { font-family: var(--ui); font-size: 12px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; color: var(--ink-2); }
.tag.in { border-color: var(--ink); color: var(--ink); }
.empty { padding: 40px 12px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.rail { padding: 24px; gap: 4px; }
.rail .list li { padding-block: 14px; align-items: flex-start; }
.rail .st { font-family: var(--ui); font-size: 13px; color: var(--ink-2); }
.rail b { font-family: var(--ui); font-size: 14px; }
.sched-switch { display: flex; align-items: center; gap: 14px; }

/* Sheet (brew dialog) and toast */
.scrim { position: fixed; inset: 0; background: rgba(17,17,17,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 20; padding: 16px; }
@media (min-width: 640px) { .scrim { align-items: center; } }
.sheet { background: var(--card); border: 1px solid var(--line); border-radius: 10px; width: 100%; max-width: 480px; padding: 28px; display: flex; flex-direction: column; gap: 18px; animation: rise 200ms ease-out both; max-height: 100%; overflow: auto; }
.toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); background: var(--ink); color: var(--inv); font-family: var(--ui); font-size: 14px; padding: 10px 16px; border-radius: 6px; z-index: 30; max-width: calc(100vw - 32px); }
.proto { position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 15; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; background: var(--card); border: 1px dashed var(--ink-2); border-radius: 8px; padding: 6px 8px; font-family: var(--ui); font-size: 11px; max-width: calc(100vw - 24px); width: max-content; }
.proto b { letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-size: 10px; padding-inline: 4px; }
.proto button { min-height: 32px; padding: 4px 10px; font-size: 12px; }
@media (max-width: 520px) { .card, .hero { padding: 24px 20px; } .pile { padding-inline: 18px; } .mag { grid-template-columns: 1fr; } .mag .page { aspect-ratio: auto; min-height: 210px; } .mag .cover { max-width: 190px; aspect-ratio: 5 / 7; } .top { gap: 8px; } .top:has(.nav) .brand span { display: none; } }
@media (prefers-reduced-motion: reduce) { .ob .card, .sheet { animation: none; } .bar > i, .sw::after { transition: none; } }
</style>

<div id="app"></div>
<div id="proto" class="proto" role="group" aria-label="Prototype controls"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function () {
  'use strict';
  var NOW = new Date();
  var DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var LOOKS = {
    broadsheet: { name: 'Broadsheet', note: 'Serif headlines, ink black', d: "'Fraunces', Georgia, serif", b: "'Source Serif 4', Georgia, serif", a: '#151412' },
    fieldnotes: { name: 'Field Notes', note: 'Clean sans, burnt orange', d: "'DM Sans', system-ui, sans-serif", b: "'DM Sans', system-ui, sans-serif", a: '#d9480f' },
    zine: { name: 'Zine', note: 'Mono headlines, blue', d: "'Space Mono', ui-monospace, monospace", b: "'Source Serif 4', Georgia, serif", a: '#1d4ed8' }
  };
  var SENDERS = ['Weekly Systems', 'The Margin Note', 'Deep Stack Weekly', 'Sunday Letter', 'Field Report'];
  var SAMPLE = [
    { id: 1, t: 'Why most dashboards go unread', s: 'Weekly Systems', m: 9, v: 'Gmail' },
    { id: 2, t: 'A field guide to quiet software', s: 'The Margin Note', m: 12, v: 'Gmail' },
    { id: 3, t: 'What the compiler knows that you don’t', s: 'Deep Stack Weekly', m: 15, v: 'Gmail' },
    { id: 4, t: 'Notes on making a thing last', s: 'Sunday Letter', m: 7, v: 'Email' },
    { id: 5, t: 'The case for a four-day reading week', s: 'Field Report', m: 11, v: 'Gmail' },
    { id: 6, t: 'How rail timetables got so good', s: 'news.ycombinator.com', m: 14, v: 'Web' },
    { id: 7, t: 'Small tools, long lives', s: 'The Margin Note', m: 6, v: 'Gmail' }
  ];
  var S = {
    view: 'onboarding', step: 0, edit: null,
    gmail: { state: 'idle', senders: SENDERS.map(function (n) { return { n: n, on: true }; }) },
    paper: 'booklet', look: 'broadsheet',
    first: { state: 'idle', pct: 0, label: '', links: [] },
    sched: { on: true, days: [6], hour: 8, budget: 45 },
    printer: { state: 'none', name: '' },
    pile: [], picked: {}, brew: { open: false, state: 'idle', pct: 0, target: 'pdf' }, linkDraft: ''
  };

  /* ---------- helpers ---------- */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }
  function fmtHour(h) { return (h % 12 || 12) + ':00 ' + (h < 12 ? 'am' : 'pm'); }
  function nextRun() {
    if (!S.sched.on || !S.sched.days.length) return null;
    for (var o = 0; o < 8; o++) {
      var d = new Date(NOW); d.setDate(NOW.getDate() + o); d.setHours(S.sched.hour, 0, 0, 0);
      if (S.sched.days.indexOf((d.getDay() + 6) % 7) > -1 && d > NOW) return d;
    }
    return null;
  }
  function runLabel(d) {
    var wd = d.toLocaleDateString('en-GB', { weekday: 'long' });
    var days = Math.round((new Date(d).setHours(0, 0, 0, 0) - new Date(NOW).setHours(0, 0, 0, 0)) / 864e5);
    var rel = days === 0 ? 'today' : days === 1 ? 'tomorrow' : 'in ' + days + ' days';
    return { when: wd + ' at ' + fmtHour(S.sched.hour), rel: rel, short: wd + ' ' + fmtHour(S.sched.hour) };
  }
  function schedSummary() {
    if (!S.sched.on || !S.sched.days.length) return 'Off. You brew by hand.';
    var names = S.sched.days.slice().sort().map(function (i) { return DAYS[i]; });
    return names.join(', ') + ' at ' + fmtHour(S.sched.hour);
  }
  function chosen() {
    if (S.sched.on) {
      var out = [], used = 0;
      S.pile.forEach(function (a) { if (used + a.m <= S.sched.budget || !out.length) { out.push(a); used += a.m; } });
      return out;
    }
    return S.pile.filter(function (a) { return S.picked[a.id]; });
  }
  function minutes(list) { return list.reduce(function (n, a) { return n + a.m; }, 0); }
  function hostOf(u) { try { return new URL(/^https?:/.test(u) ? u : 'https://' + u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h);
    toast.h = setTimeout(function () { t.hidden = true; }, 2600);
  }
  var TICK = '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>';
  var OPEN = '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="opacity:.35"><circle cx="12" cy="12" r="10"/></svg>';
  var LOGO = '<svg width="30" height="30" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4h24"/><rect x="16" y="8" width="32" height="46" rx="4"/><circle cx="32" cy="15" r="3.5"/><path d="M25 22h14v3a3 3 0 0 1-3 3h-8a3 3 0 0 1-3-3z"/><path d="M39 24.5h14"/><path d="M29.5 28h5l-1 3h-3z"/><path d="M22 58h20"/><path d="M26 44h12l-1.5 9h-9z"/></svg>';

  /* ---------- magazine preview ---------- */
  function lookVars(k) { var l = LOOKS[k]; return '--d:' + l.d + ';--b:' + l.b + ';--a:' + l.a; }
  function magazine(k, titles, mins) {
    var date = NOW.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }).toUpperCase();
    var heads = titles.slice(0, 4).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('');
    var first = esc(titles[0] || 'Why most dashboards go unread');
    var bars = '<div class="tx">A dashboard is a promise that someone will look. Most teams keep the promise for a week, then the tab joins forty others. The ones that last are built around a single decision, not a single screen.</div>';
    var left = '<div class="page" style="' + lookVars(k) + '"><div class="kick">Essay</div><h4>' + first + '</h4>' + bars + bars + '</div>';
    var right = '<div class="page" style="' + lookVars(k) + '"><div class="quote">Built around a single decision, not a single screen.</div>' + bars + bars + '</div>';
    return '<div class="mag"><div class="page cover" style="' + lookVars(k) + '"><div><div class="bar-a"></div><div class="meta" style="margin-top:6px">Issue No. 1 · ' + date + '</div></div><div class="t">Your reading, on paper</div><ul>' + heads + '</ul><div class="meta">' + titles.length + ' articles · ' + mins + ' min</div></div><div class="spread">' + left + right + '</div></div>';
  }
  function paperIcon(kind) {
    if (kind === 'booklet') return '<svg class="mini" viewBox="0 0 96 56" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="6" y="4" width="40" height="48" rx="1.5"/><rect x="50" y="4" width="40" height="48" rx="1.5"/><path d="M13 14h26M13 20h26M13 26h18M57 14h26M57 20h26M57 26h18" opacity=".5"/></svg>';
    return '<svg class="mini" viewBox="0 0 96 56" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="28" y="4" width="40" height="48" rx="1.5"/><path d="M35 14h26M35 20h26M35 26h26M35 32h16" opacity=".5"/></svg>';
  }

  /* ---------- onboarding cards ---------- */
  var STEPS = 5;
  function dots(n) {
    var s = ''; for (var i = 1; i <= STEPS; i++) s += '<i class="' + (i <= n ? 'on' : '') + '"></i>';
    return '<div class="dots" role="img" aria-label="Step ' + n + ' of ' + STEPS + '">' + s + '<span>Step ' + n + ' of ' + STEPS + '</span></div>';
  }
  function beatsIcon(kind) {

    S.pile = SAMPLE.slice(); S.picked = {}; SAMPLE.slice(0, 4).forEach(function (a) { S.picked[a.id] = true; });
  }
  function afterEdit() { S.edit = null; S.view = S.returnTo || 'desk'; render(); }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]'); if (!el) return;
    var a = el.getAttribute('data-a'), i = +el.getAttribute('data-i'), v = el.getAttribute('data-v');
    if (a === 'dl') { e.preventDefault(); toast('In the real app this downloads the .dmg.'); return; }
    switch (a) {
      case 'next': S.step = Math.min(CARDS.length - 1, S.step + 1); break;
      case 'back': S.step = Math.max(0, S.step - 1); break;
      case 'gmail': S.gmail.state = 'connecting'; render(); setTimeout(function () { S.gmail.state = 'connected'; render(); }, 1000); return;
      case 'sender': S.gmail.senders[i].on = !S.gmail.senders[i].on; break;
      case 'copy': try { navigator.clipboard.writeText('quiet-maple-river@cloudmailin.net').then(function () { toast('Address copied'); }, function () { toast('Select the address and copy it'); }); } catch (x) { toast('Select the address and copy it'); } return;
      case 'paper': S.paper = v; break;
      case 'look': S.look = v; break;
      case 'addlink':
        var val = ($('linkIn') && $('linkIn').value || '').trim(), h = hostOf(val);
        if (!h) { toast('Paste a full link, like https://example.com/article'); return; }
        S.linkDraft = '';
        if (S.view === 'onboarding') S.first.links.push(h); else { S.pile.unshift({ id: Date.now(), t: 'Article from ' + h, s: h, m: 8, v: 'Web' }); S.picked[S.pile[0].id] = true; toast('Saved to your pile'); }
        break;
      case 'brewfirst': runBrewFirst(); return;
      case 'pdf': toast('In the real app the PDF downloads now.'); return;
      case 'day': var ix = S.sched.days.indexOf(i); if (ix > -1) S.sched.days.splice(ix, 1); else S.sched.days.push(i); S.sched.on = true; break;
      case 'nosched': S.sched.on = false; S.step = 5; break;
      case 'pair': S.printer.state = 'pairing'; render(); setTimeout(function () { S.printer = { state: 'connected', name: 'Brother HL-L2350DW' }; render(); }, 1600); return;
      case 'finish': S.view = 'desk'; S.step = 0; toast('Pile is empty, as it would be. Try "Newsletters arrive" below.'); break;
      case 'nav': S.view = v; break;
      case 'edit': S.returnTo = S.view; S.edit = i; S.view = 'onboarding'; if (i === 4 && !S.sched.days.length) S.sched.days = [6]; S.sched.on = i === 4 ? true : S.sched.on; break;
      case 'save-edit': case 'cancel-edit': afterEdit(); return;
      case 'togglesched': S.sched.on = !S.sched.on; if (S.sched.on && !S.sched.days.length) S.sched.days = [6]; break;
      case 'pick': S.picked[i] = !S.picked[i]; break;
      case 'remove': S.pile = S.pile.filter(function (x) { return x.id !== i; }); break;
      case 'brewopen': S.brew = { open: true, state: 'idle', pct: 0, target: 'pdf' }; break;
      case 'brewclose': case 'brewdone': S.brew.open = false; if (a === 'brewdone') { var used = chosen().map(function (x) { return x.id; }); S.pile = S.pile.filter(function (x) { return used.indexOf(x.id) < 0; }); toast('Moved to Issues'); } break;
      case 'brewgo': runBrewSheet(v); return;
      case 'restart': S = freshState(); break;
      case 'skipapp': S = freshState(); S.view = 'desk'; S.gmail.state = 'connected'; S.printer = { state: 'connected', name: 'Brother HL-L2350DW' }; fillPile(); break;
      case 'simmail': fillPile(); toast('Five newsletters and two links arrived'); break;
      case 'clearpile': S.pile = []; S.picked = {}; break;
    }
    render();
    if (a === 'next' || a === 'back' || a === 'finish' || a === 'nav' || a === 'edit' || a === 'restart' || a === 'skipapp') window.scrollTo(0, 0);
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'budget') {
      S.sched.budget = +e.target.value; $('budgetVal').textContent = S.sched.budget + ' minutes';
    } else if (e.target.id === 'linkIn') { S.linkDraft = e.target.value; }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'hour') { S.sched.hour = +e.target.value; $('nextCallout').innerHTML = nextCalloutInner(); }
    if (e.target.id === 'budget') render();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.brew.open && S.brew.state !== 'brewing') { S.brew.open = false; render(); }
    if (e.key === 'Enter' && e.target.id === 'linkIn') { e.preventDefault(); var b = document.querySelector('[data-a="addlink"]'); if (b) b.click(); }
  });
  function freshState() {
    return {
      view: 'onboarding', step: 0, edit: null,
      gmail: { state: 'idle', senders: SENDERS.map(function (n) { return { n: n, on: true }; }) },
      paper: 'booklet', look: 'broadsheet',
      first: { state: 'idle', pct: 0, label: '', links: [] },
      sched: { on: true, days: [6], hour: 8, budget: 45 },
      printer: { state: 'none', name: '' },
      pile: [], picked: {}, brew: { open: false, state: 'idle', pct: 0, target: 'pdf' }, linkDraft: ''
    };
  }
  render();
})();
</script>
